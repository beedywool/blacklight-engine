# pnpm settings of the game (written by create-blacklight).
# Dependencies allowed to run install scripts; pnpm blocks the others.
allowBuilds:
  esbuild: true
  # Desktop builds (@blacklight/native): Electron's binary and the SDL gamepad library.
  electron: true
  '@kmamal/sdl': true
  # Squirrel.Windows installer pulled by electron-builder; the NSIS target does not need it.
  electron-winstaller: false
