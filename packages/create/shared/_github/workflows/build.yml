# Builds the game for every target on each push and pull request (written by create-blacklight).
# Each job uploads its files as an artifact of the run.
#
# Signing is optional and uses only your own credentials: add the secrets below in the repository
# settings (Settings → Secrets and variables → Actions). A job whose secrets are missing builds
# unsigned, says so in a notice, and still succeeds; unsigned builds are enough to test.
# The docs explain where each one comes from (Publishing › GitHub secrets).
#
#   Secret                          Used by    What it holds
#   WIN_CSC_LINK                    Windows    code signing certificate, .pfx file in base64
#   WIN_CSC_KEY_PASSWORD            Windows    password of that .pfx
#   AZURE_SIGNING_ENDPOINT          Windows    instead of a .pfx: Azure Trusted Signing endpoint
#   AZURE_SIGNING_ACCOUNT           Windows    Trusted Signing account name
#   AZURE_SIGNING_PROFILE           Windows    certificate profile name
#   AZURE_SIGNING_PUBLISHER         Windows    publisher name (CN) of the certificate profile
#   AZURE_TENANT_ID                 Windows    Microsoft Entra tenant of the signing app
#   AZURE_CLIENT_ID                 Windows    app (client) id allowed to sign
#   AZURE_CLIENT_SECRET             Windows    client secret of that app
#   CSC_LINK                        macOS      "Developer ID Application" certificate, .p12 in base64
#   CSC_KEY_PASSWORD                macOS      password of that .p12
#   APPLE_API_KEY_P8                macOS, iOS App Store Connect API key, contents of the AuthKey_<id>.p8 file
#   APPLE_API_KEY_ID                macOS, iOS its key id
#   APPLE_API_ISSUER                macOS, iOS its issuer id
#   APPLE_ID                        macOS      instead of the API key: Apple ID e-mail
#   APPLE_APP_SPECIFIC_PASSWORD     macOS      instead of the API key: app-specific password
#   APPLE_TEAM_ID                   macOS, iOS your 10-character team id
#   IOS_DIST_CERT_P12               iOS        "Apple Distribution" certificate, .p12 in base64
#   IOS_DIST_CERT_PASSWORD          iOS        password of that .p12
#   ANDROID_KEYSTORE_BASE64         Android    upload keystore (.jks) in base64
#   ANDROID_KEYSTORE_PASSWORD       Android    keystore password
#   ANDROID_KEY_ALIAS               Android    key alias
#   ANDROID_KEY_PASSWORD            Android    key password
#
# Steam uploads are not done here: steamcmd needs a Steam Guard confirmation for the builder
# account, so run `blacklight upload --target steam` from your machine.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec blacklight build --target web
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: dist/

  # Windows (NSIS installer + portable), macOS (x64 + arm64, dmg + zip), Linux (AppImage + deb).
  # Each OS builds on its own runner: V8 bytecode and the SDL gamepad library match the machine.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      # Each certificate reaches only its own OS: the Windows build never sees the Apple one.
      WIN_CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      AZURE_SIGNING_ENDPOINT: ${{ matrix.target == 'win' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
      AZURE_SIGNING_ACCOUNT: ${{ matrix.target == 'win' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
      AZURE_SIGNING_PROFILE: ${{ matrix.target == 'win' && secrets.AZURE_SIGNING_PROFILE || '' }}
      AZURE_SIGNING_PUBLISHER: ${{ matrix.target == 'win' && secrets.AZURE_SIGNING_PUBLISHER || '' }}
      AZURE_TENANT_ID: ${{ matrix.target == 'win' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ matrix.target == 'win' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ matrix.target == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
      CSC_LINK: ${{ matrix.target == 'mac' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY_P8: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_P8 || '' }}
      APPLE_API_KEY_ID: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.target == 'mac' && secrets.APPLE_API_ISSUER || '' }}
      APPLE_ID: ${{ matrix.target == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron-builder reads the App Store Connect key from a file (APPLE_API_KEY = its path).
      - name: App Store Connect API key
        if: env.APPLE_API_KEY_P8 != ''
        shell: bash
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Unsigned Windows build
        if: matrix.target == 'win' && (env.WIN_CSC_LINK == '' || env.WIN_CSC_KEY_PASSWORD == '') && (env.AZURE_SIGNING_ACCOUNT == '' || env.AZURE_CLIENT_SECRET == '')
        run: echo "::notice::Windows build unsigned (SmartScreen will warn players). Add WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, or the AZURE_* secrets of Azure Trusted Signing, to sign it."
      - name: Unsigned macOS build
        if: matrix.target == 'mac' && (env.CSC_LINK == '' || env.CSC_KEY_PASSWORD == '')
        run: echo "::notice::macOS build unsigned and not notarized (Gatekeeper blocks it). Add CSC_LINK and CSC_KEY_PASSWORD, then APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER."
      # The main process is compiled to V8 bytecode inside Electron, which needs a display on Linux.
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec blacklight build --target linux
      - if: runner.os != 'Linux'
        run: pnpm exec blacklight build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.target }}
          path: |
            release/${{ matrix.target }}/*.exe
            release/${{ matrix.target }}/*.dmg
            release/${{ matrix.target }}/*.zip
            release/${{ matrix.target }}/*.AppImage
            release/${{ matrix.target }}/*.deb

  # Debug APK, or a signed release APK and App Bundle (.aab) when the keystore secrets exist.
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile
      - name: Build
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            pnpm exec blacklight build --target android --release
            # Google Play takes App Bundles only.
            pnpm exec blacklight build --target android --aab
          else
            echo "::notice::Android debug build only. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (and ANDROID_KEY_PASSWORD) for a signed release build."
            pnpm exec blacklight build --target android
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: release/android/

  # iOS Simulator build (no signing), plus a signed .ipa for App Store Connect when the iOS
  # secrets exist: the Apple Distribution certificate goes into a temporary keychain and Xcode
  # creates the provisioning profile itself with the App Store Connect API key.
  ios:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec blacklight build --target ios
      - name: Signed App Store build
        if: env.APPLE_TEAM_ID != '' && env.IOS_DIST_CERT_P12 != '' && env.APPLE_API_KEY_P8 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER != ''
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" pnpm exec blacklight build --target ios --release
      - name: Unsigned iOS build
        if: env.APPLE_TEAM_ID == '' || env.IOS_DIST_CERT_P12 == '' || env.APPLE_API_KEY_P8 == '' || env.APPLE_API_KEY_ID == '' || env.APPLE_API_ISSUER == ''
        run: echo "::notice::iOS Simulator build only. Add APPLE_TEAM_ID, IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER for a signed .ipa."
      - uses: actions/upload-artifact@v5
        with:
          name: ios
          path: release/ios/
