name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter blacklight-template-empty build
      - run: pnpm --filter blacklight-template-persona-menu typecheck
      - run: pnpm docs:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: e2e/__screenshots__/
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Phase 3d gate: the mobile fixture and a template on an Android emulator (e2e/mobile-android.spec.ts).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: BLACKLIGHT_E2E_ANDROID=1 pnpm exec playwright test e2e/mobile-android.spec.ts
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-e2e
          path: |
            playwright-report/
            test-results/
            e2e/fixtures/mobile/release/android/
          retention-days: 7

  # Phase 3d gate: the mobile fixture on the iOS Simulator (e2e/mobile-ios.spec.ts).
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: BLACKLIGHT_E2E_IOS=1 pnpm exec playwright test e2e/mobile-ios.spec.ts
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
