name: CI

# Two tiers.
# - Fast (every push and pull request, must stay green): lint, type checks, unit tests with the
#   coverage gate, api:check and the docs build on Linux; unit tests and the VS Code extension
#   tests on Windows and macOS; the e2e suite on Linux, without the tests tagged @flaky; the
#   desktop packages of the three systems.
# - Full (nightly, and workflow_dispatch): also e2e on macOS with one more retry for the specs that
#   draw a lot (e2e/tiers.ts) and the @flaky tests, the benchmarks on Linux and macOS (absolute
#   limits only), the Android emulator and the iOS Simulator. It never blocks a push.
# Windows e2e and benchmarks run on a real Windows machine (CONTRIBUTING.md): GitHub's Windows
# runners have no GPU and their software rendering made those tests fail at random.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  # A full-tier run, or part of one to iterate on a failure.
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Jobs to run, comma-separated: check, e2e, bench, android, ios, desktop-packages'
        default: 'check,e2e,bench,android,ios,desktop-packages'
      os:
        description: 'Operating systems of the check and desktop-packages jobs, and of e2e and bench except Windows (JSON list)'
        default: '["ubuntu-latest","windows-latest","macos-latest"]'
      spec:
        description: 'Playwright arguments for the e2e and bench jobs, split on spaces (e2e/ui.spec.ts --grep=Survival); empty runs all'
        default: ''

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.jobs, 'check')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The sources are the same on every OS: the static checks run on Linux.
      - if: runner.os == 'Linux'
        run: pnpm lint
      - if: runner.os == 'Linux'
        run: pnpm typecheck
      # Before the unit tests: the core-browser Vitest project runs in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      # Unit tests on every OS, including the relay's Node test of two headless party-game
      # instances playing online (servers/relay/test).
      - run: pnpm test
      # NF-07: unit coverage of core and net (Node and Chromium runs merged) at or above the
      # thresholds in vitest.config.ts, or the job fails.
      - if: runner.os == 'Linux'
        run: pnpm test:coverage
      # NF-06: public API documented, typed and recorded in api-report.txt.
      - if: runner.os == 'Linux'
        run: pnpm api:check
      # PF-09: the build workflow create-blacklight writes into every game (and this file).
      - if: runner.os == 'Linux'
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color packages/create/shared/_github/workflows/build.yml .github/workflows/ci.yml
      - if: runner.os == 'Linux'
        run: pnpm --filter blacklight-template-empty build
      - if: runner.os == 'Linux'
        run: pnpm --filter blacklight-template-persona-menu typecheck
      - if: runner.os == 'Linux'
        run: pnpm docs:build
      - run: pnpm --filter blacklight-vscode test:integration

  # Playwright specs (`pnpm e2e`) in eight shards on runners of their own. Each runs one test file
  # at a time (playwright.config.ts): specs side by side fight over the runner's few CPUs, and the
  # hosted runners' software GPU turns that into timeouts. Fast tier: Linux, without @flaky
  # tests. Full tier: Linux and macOS (or the systems asked for), every test.
  e2e:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.jobs, 'e2e')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["ubuntu-latest"]' || inputs.os || '["ubuntu-latest","macos-latest"]') }}
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SPEC: ${{ inputs.spec }}
      BLACKLIGHT_CI_TIER: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'fast' || 'full' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Electron (e2e/desktop.spec.ts) needs a display on Linux, and Ubuntu 24.04 restricts the
      # unprivileged user namespaces Chromium's sandbox uses.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # $SPEC is split on spaces into Playwright arguments. The fast tier leaves out the tests
      # tagged @flaky (CONTRIBUTING.md, "Known flaky tests").
      - if: runner.os == 'Linux'
        run: |
          read -ra spec <<< "$SPEC"
          if [ "$BLACKLIGHT_CI_TIER" = fast ]; then spec+=(--grep-invert=@flaky); fi
          xvfb-run -a pnpm e2e --shard=${{ matrix.shard }}/8 --pass-with-no-tests "${spec[@]}"
      - if: runner.os != 'Linux'
        run: |
          read -ra spec <<< "$SPEC"
          if [ "$BLACKLIGHT_CI_TIER" = fast ]; then spec+=(--grep-invert=@flaky); fi
          pnpm e2e --shard=${{ matrix.shard }}/8 --pass-with-no-tests "${spec[@]}"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.shard }}
          path: e2e/__screenshots__/
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Full tier. NF-01 and NF-02 benchmarks on a runner of their own, so nothing else competes for
  # it. CI checks the spec's absolute limits only (BLACKLIGHT_BENCH_LIMITS_ONLY): shared runners
  # vary by more than 10 %, so the regression gate against e2e/bench-baseline.json runs locally
  # with `pnpm bench` on a stable machine. The results are uploaded (bench-results-<os>).
  bench:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && contains(inputs.jobs, 'bench'))
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","macos-latest"]') }}
        exclude:
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SPEC: ${{ inputs.spec }}
      BLACKLIGHT_BENCH_RUNNER: github-${{ matrix.os }}
      BLACKLIGHT_BENCH_LIMITS_ONLY: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The cold-start spec starts the packaged desktop app, which needs a display on Linux.
      - if: runner.os == 'Linux'
        run: |
          read -ra spec <<< "$SPEC"
          xvfb-run -a pnpm bench --pass-with-no-tests "${spec[@]}"
      - if: runner.os != 'Linux'
        run: |
          read -ra spec <<< "$SPEC"
          pnpm bench --pass-with-no-tests "${spec[@]}"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-results-${{ matrix.os }}
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: bench-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Full tier. Phase 3d gate: the mobile fixture and a template on an Android emulator
  # (e2e/mobile-android.spec.ts), then the Android benchmarks (NF-01, NF-02 mobile, NF-03:
  # e2e/bench-android.spec.ts), absolute limits only as in the bench job.
  android:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && contains(inputs.jobs, 'android'))
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BLACKLIGHT_BENCH_LIMITS_ONLY: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            # Outside the spec: a cold Gradle build does not fit the 180 s Playwright hook timeout.
            pnpm --dir e2e/fixtures/mobile exec blacklight build --target android --sqlite
            pnpm --dir templates/persona-menu exec blacklight build --target android
            BLACKLIGHT_E2E_ANDROID=1 BLACKLIGHT_E2E_ANDROID_PREBUILT=1 pnpm exec playwright test e2e/mobile-android.spec.ts
            BLACKLIGHT_E2E_ANDROID=1 BLACKLIGHT_BENCH_RUNNER=github-android-emulator pnpm exec playwright test --project=bench bench-android
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-results-android
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-e2e
          path: |
            playwright-report/
            test-results/
            e2e/fixtures/mobile/release/android/
          retention-days: 7

  # Full tier. Phase 3d gate: the mobile fixture on the iOS Simulator (e2e/mobile-ios.spec.ts).
  ios:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && contains(inputs.jobs, 'ios'))
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: BLACKLIGHT_E2E_IOS=1 pnpm exec playwright test e2e/mobile-ios.spec.ts
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # PF-03 / PF-07: real installers for each OS from the desktop fixture, built on that OS (V8
  # bytecode and the SDL binding match the machine), plus the signing plan in dry-run mode.
  desktop-packages:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.jobs, 'desktop-packages')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Electron and electron-builder's tools come from GitHub releases; a 500 there failed the
      # macOS package once (run 41304946671). Cached, they are downloaded once per lockfile.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --dir e2e/fixtures/desktop exec blacklight build --target linux
      - if: runner.os != 'Linux'
        run: pnpm --dir e2e/fixtures/desktop exec blacklight build --target ${{ matrix.target }}
      - run: pnpm --dir e2e/fixtures/desktop exec blacklight sign --dry-run --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.target }}
          path: |
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.exe
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.dmg
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.zip
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.AppImage
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.deb
          retention-days: 7
