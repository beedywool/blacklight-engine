name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # NF-06: public API documented, typed and recorded in api-report.txt.
      - run: pnpm api:check
      # PF-09: the build workflow create-blacklight writes into every game (and this file).
      - if: runner.os == 'Linux'
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color packages/create/shared/_github/workflows/build.yml .github/workflows/ci.yml
      - run: pnpm --filter blacklight-template-empty build
      - run: pnpm --filter blacklight-template-persona-menu typecheck
      - run: pnpm docs:build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Electron (e2e/desktop.spec.ts) needs a display on Linux, and Ubuntu 24.04 restricts the
      # unprivileged user namespaces Chromium's sandbox uses.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e
      - if: runner.os != 'Linux'
        run: pnpm e2e
      - run: pnpm --filter blacklight-vscode test:integration
      # NF-01 and NF-02 benchmarks, after the other tests so the runner is idle. Baselines are per
      # runner (e2e/bench-baseline.json); a runner without one records its results and passes. Copy
      # them from the bench-results-<os> artifact of a green main run: node scripts/bench.mjs update.
      # The cold-start spec starts the packaged desktop app, which needs a display on Linux.
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm bench
        env:
          BLACKLIGHT_BENCH_RUNNER: github-${{ matrix.os }}
      - if: runner.os != 'Linux'
        run: pnpm bench
        env:
          BLACKLIGHT_BENCH_RUNNER: github-${{ matrix.os }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-results-${{ matrix.os }}
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: e2e/__screenshots__/
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Phase 3d gate: the mobile fixture and a template on an Android emulator (e2e/mobile-android.spec.ts),
  # then the Android benchmarks (NF-01, NF-02 mobile, NF-03: e2e/bench-android.spec.ts) against the
  # `github-android-emulator` baseline; without one they record their results and check the limits.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            BLACKLIGHT_E2E_ANDROID=1 pnpm exec playwright test e2e/mobile-android.spec.ts
            BLACKLIGHT_E2E_ANDROID=1 BLACKLIGHT_BENCH_RUNNER=github-android-emulator pnpm exec playwright test --project=bench bench-android
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-results-android
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-e2e
          path: |
            playwright-report/
            test-results/
            e2e/fixtures/mobile/release/android/
          retention-days: 7

  # Phase 3d gate: the mobile fixture on the iOS Simulator (e2e/mobile-ios.spec.ts).
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: BLACKLIGHT_E2E_IOS=1 pnpm exec playwright test e2e/mobile-ios.spec.ts
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # PF-03 / PF-07: real installers for each OS from the desktop fixture, built on that OS (V8
  # bytecode and the SDL binding match the machine), plus the signing plan in dry-run mode.
  desktop-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --dir e2e/fixtures/desktop exec blacklight build --target linux
      - if: runner.os != 'Linux'
        run: pnpm --dir e2e/fixtures/desktop exec blacklight build --target ${{ matrix.target }}
      - run: pnpm --dir e2e/fixtures/desktop exec blacklight sign --dry-run --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.target }}
          path: |
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.exe
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.dmg
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.zip
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.AppImage
            e2e/fixtures/desktop/release/${{ matrix.target }}/*.deb
          retention-days: 7
