name: Release

# DOC-07. Engine releases live on GitHub only (no npm, no VS Code Marketplace for now).
# - `pack` sets every package to the version of the tag, builds, packs each published package
#   (scripts/release-pack.mjs: engine dependencies point at this release's asset URLs), packages
#   the VS Code extension, builds the module registry for GitHub Pages and the release notes
#   (`pnpm changelog --notes`). Everything is uploaded to the workflow run.
# - `release` attaches the files to the GitHub Release of the tag.
# - `registry` deploys the registry index to https://beedywool.github.io/blacklight-engine/registry.
# A tag push `v*` runs all three. A manual run is a dry run by default: `pack` only, the files stay
# on the run (`gh run download <id>`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack (x.y.z). Empty: 0.0.0-dev.<run number>. A real release needs the tag v<version> to exist.'
        default: ''
      dry-run:
        description: 'Upload the files to the workflow run only: no GitHub Release, no registry deployment'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history and the tags: the release notes are the commits since the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then version="${GITHUB_REF_NAME#v}"
          else version="${INPUT_VERSION#v}"; version="${version:-0.0.0-dev.$GITHUB_RUN_NUMBER}"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$version\" is not a version (x.y.z or x.y.z-pre)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # Every package carries the release's version, whatever the commit says (the extension too).
      - run: pnpm -r --filter "./packages/**" --filter "./servers/relay" exec npm pkg set "version=${{ steps.version.outputs.version }}"
      - run: pnpm build
      - run: node scripts/release-pack.mjs --version "${{ steps.version.outputs.version }}" --out release
      - run: |
          pnpm --filter blacklight-vscode package
          mv packages/vscode/dist/blacklight.vsix "release/blacklight-vscode-${{ steps.version.outputs.version }}.vsix"
      # The registry index: official modules point at this release's tarballs. The site keeps
      # registry/ in a folder of its own so the docs can share the Pages site later.
      - run: |
          node packages/registry/dist/cli.js build packages/registry/index --out site/registry \
            --local packages/modules \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.version.outputs.version }}"
          touch site/.nojekyll
      - env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then section="$VERSION"; else section=Unreleased; fi
          node scripts/changelog.mjs --notes "$section" > notes.md
          {
            echo
            echo "Create a game: \`pnpm dlx https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/create-blacklight-$VERSION.tgz my-game\`."
            echo "Upgrade a game: \`pnpm blacklight upgrade $VERSION\`. VS Code: \`code --install-extension blacklight-vscode-$VERSION.vsix\`."
          } >> notes.md
          mv notes.md release-notes.md
          ls -l release
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            release/
            release-notes.md
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  release:
    needs: pack
    if: github.event_name == 'push' || !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ needs.pack.outputs.version }}
      # --verify-tag: a manual real release needs the tag pushed first.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Blacklight Engine $VERSION" --notes-file release-notes.md "${flags[@]}"

  registry:
    needs: [pack, release]
    if: github.event_name == 'push' || !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}registry/v1/index.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
