<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same policy as release builds, plus blob: scripts: the runner imports the compiled files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Blacklight example</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #080808;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      .runner-error {
        position: fixed;
        inset: auto 0 0 0;
        max-height: 60%;
        overflow: auto;
        margin: 0;
        padding: 12px 16px;
        background: #8c1d18;
        color: #f9dedc;
        font:
          13px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          monospace;
        white-space: pre-wrap;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
