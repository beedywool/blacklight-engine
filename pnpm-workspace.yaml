packages:
  - packages/*
  - templates/*
  - docs
  - e2e/fixtures/*

# Dependencies allowed to run install scripts (pnpm blocks the others).
allowBuilds:
  esbuild: true
  # Desktop (@blacklight/native): Electron's binary and the SDL gamepad binding's prebuilt library.
  electron: true
  '@kmamal/sdl': true
  # Squirrel.Windows installer pulled by electron-builder; the NSIS target does not need it.
  electron-winstaller: false

minimumReleaseAgeExclude:
  - framer-motion@14.8.0
  - motion-dom@14.8.0
  - motion@14.8.0
  - '@vue/language-core@3.3.14'
  - vue-tsc@3.3.14
