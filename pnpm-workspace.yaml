packages:
  - packages/*
  - packages/modules/*
  - servers/*
  - templates/*
  - docs
  - e2e/fixtures/*
  - servers/*

# Dependencies allowed to run install scripts (pnpm blocks the others).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - framer-motion@14.8.0
  - motion-dom@14.8.0
  - motion@14.8.0
  - '@vue/language-core@3.3.14'
  - vue-tsc@3.3.14
